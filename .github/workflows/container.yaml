name: Container

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests, build, and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for credentials
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts=--all --redact --no-banner
      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.github/workflows,target=/workflows,readonly" \
            --entrypoint /bin/sh \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -c 'actionlint /workflows/*.y*ml'
      - name: Lint Raspberry Pi deployment scripts
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE/deploy/pi,target=/scripts,readonly" \
            --entrypoint /bin/sh \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -c 'shellcheck /scripts/*.sh'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check release version and tag
        run: npm run release:check
      - name: Lint TypeScript and JavaScript
        run: npm run lint
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Run unit and integration tests
        run: npm test
      - name: Check the optional Raspberry Pi browser installer
        run: python3 -c "import ast, pathlib; ast.parse(pathlib.Path('deploy/pi/install-browser.py').read_text())"
      - name: Test Hub-controlled Pi updates
        run: python3 scripts/pi-agent.test.py
      - name: Test scheduled display sleep and recovery
        run: python3 scripts/pi-display.test.py
      - name: Test Raspberry Pi provisioning and update recovery
        run: npm run test:pi
      - name: Test release versioning and update channels
        run: npm run test:release
      - name: Type-check and build production assets
        run: npm run build

  verify:
    name: Container smoke test (${{ matrix.arch }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Check the Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          call: check
      - name: Test and build the container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: imframe:check
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,scope=container-${{ matrix.arch }},mode=max
      - name: Check startup and settings persistence
        run: node scripts/smoke-container.mjs imframe:check

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Serialize channel updates. Each job reads the current tags after it starts,
    # so publishing an older release cannot move latest or a series backward.
    concurrency:
      group: ghcr-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Choose release tags
        id: release
        run: node scripts/release.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Sign in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and repository link
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.release == 'true' }},priority=900
            type=raw,value=${{ steps.release.outputs.minor }},enable=${{ steps.release.outputs.publish_minor == 'true' }},priority=800
            type=raw,value=${{ steps.release.outputs.major }},enable=${{ steps.release.outputs.publish_major == 'true' }},priority=700
            type=raw,value=latest,enable=${{ steps.release.outputs.publish_latest == 'true' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Publish AMD64 and ARM64
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=container-amd64
            type=gha,scope=container-arm64
          cache-to: type=gha,scope=container-publish,mode=max

  verify-published:
    name: Pull published image (${{ matrix.arch }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull by digest and test the published container
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          docker pull --platform "$PLATFORM" "$IMAGE"
          node scripts/smoke-container.mjs "$IMAGE" "$PLATFORM"
